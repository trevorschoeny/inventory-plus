// ═══════════════════════════════════════════════════════════════════════════
// Inventory Plus (IP) — pure client-only Fabric mod, depends only on MK 1.0.0
// (the widgets artifact). Phase 18b fresh-build per Lead @ Inventory Plus'
// brief (2026-05-15): three zero-gap features — Auto-restock, Move-matching,
// Sorting — built against MK 1.0.0 as the only library dep. No MKC.
//
// Per §0005: IP is pure client-only; installs on any vanilla server. The
// fabric.mod.json declares "environment": "client" — §0042's compile-time
// partition is satisfied by the dependency declaration alone (we never reach
// MKC types because they're not on this classpath).
//
// Workspace integration: included from the root settings.gradle as
// `:inventory-plus`. Build with `./gradlew :inventory-plus:build` from the
// workspace root.
// ═══════════════════════════════════════════════════════════════════════════

plugins {
    // 26.x migration (2026-07-02): Loom plugin id is namespaced at 1.15+;
    // 1.17 is the 26.2-era line. Version pinned at the workspace root.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('inventoryplus_version')
group   = property('maven_group')

base.archivesName = 'inventory-plus'

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // ModMenu — Terraformers' Maven; used for the per-mod config entry
    // point on the mods list.
    maven { url 'https://maven.terraformersmc.com/releases/' }
    // YACL — modern Fabric config-screen framework (horizontal tabs,
    // right-pane descriptions, per-entry reset arrows). Same look as
    // Sodium / Iris / Debugify configs.
    // 26.x: isxander's own maven stops at the 3.8.x line; the 26.2 builds
    // (3.9.x) ship via the Modrinth maven only (verified 2026-07-02).
    maven { url 'https://api.modrinth.com/maven' }
}

// MenuKit 6.0.0 splits into main and client source sets (§0062). A project
// dependency sees only main, so its client half is added by output (in the
// client dependencies after loom {}), which needs MenuKit evaluated first. A
// published jar holds both halves.
evaluationDependsOn(':menukit')

dependencies {
    // 26.x: the game is unobfuscated — no mappings line, and mod deps use the
    // standard java configurations (modImplementation → implementation etc.).
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // YACL — config-screen framework. Bundled into IP's jar via Loom's
    // `include` (Jar-in-Jar), so players install IP and YACL comes along
    // for free. `implementation` covers compile + dev runtime; the
    // `include` line is what JIJs YACL into the production jar.
    implementation "maven.modrinth:yacl:3.9.6+26.2-fabric"
    include        "maven.modrinth:yacl:3.9.6+26.2-fabric"

    // §0042 / §0005: depend on MenuKit and ONLY MenuKit. Adding
    // :menukit-containers here would put its types on the classpath and break
    // the partition test. (26.x: a plain project dep is the artifact now.)
    implementation project(':menukit')
}

loom {
    // §0062: Inventory Plus is universal. src/main holds what a server may
    // load (the operation keys and the api types that name no client class);
    // src/client holds every feature, mixin, screen and keybind. The compiler
    // refuses a main class that reaches a client one.
    splitEnvironmentSourceSets()
    mods {
        inventoryplus {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client { ideConfigGenerated = false }
        server { ideConfigGenerated = false }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh inventory-plus <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
    }
}

// Client-only dependencies, after loom {} so its client configurations exist.
dependencies {
    // MenuKit's client half (UI, screens), which the project dep above leaves out.
    clientImplementation rootProject.project(':menukit').sourceSets.client.output

    // Keybindery — required (Trev, 2026-09-27): the settings menu binds keys
    // with its MenuKit ChordButton, the same chord capture and conflict view
    // as Keybindery's own screens. Client-only, like Keybindery itself.
    clientImplementation project(':keybindery')

    // ModMenu — surfaces the settings menu from the mods list. Optional at
    // runtime; compileOnly means we compile against its API, localRuntime
    // brings it into the dev launch. (⚠️ beta — only 26.2 build available.)
    clientCompileOnly "com.terraformersmc:modmenu:20.0.1"
    localRuntime "com.terraformersmc:modmenu:20.0.1"
}

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

// Stamp the real project version into fabric.mod.json at build — the manifest
// declares "version": "${version}"; a hardcoded manifest version silently
// breaks every dependency gate against this mod (the 2026-07-01 incident).
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// Inventory Plus — Modrinth project id ZeMbvaXz (slug inventory-plus).
// Lead @ Trevlar Mods owns the publish (§0032).
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "ZeMbvaXz"
    versionNumber = property('inventoryplus_version')
    versionName = "Inventory Plus ${property('inventoryplus_version')}"
    versionType = "release"
    // ci-cd.md stage 5: the player-facing changelog lives in changelog.md, one entry,
    // overwritten each release (git keeps the history). Hardcoding it here went stale.
    changelog = file('changelog.md').text
    // ci-cd.md stage 7: the README is the public description; `modrinthSyncBody` pushes it.
    syncBodyFrom = file('README.md').text
    // 26.x: no remap step — `jar` IS the shippable artifact (remapJar is gone).
    uploadFile = jar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "menukit"
        required.project "keybindery"
    }
}

// ci-cd.md stage 2: the shipped jar must self-report the bumped version. A jar that
// says the wrong version silently breaks every dependency gate against it, so this
// fails the build instead of relying on someone remembering to unzip and look.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion

// ci-cd.md stage 2: this mod must pin MenuKit to the major it was built against.
// The floor guarantees every MenuKit call it makes exists at load time; the ceiling stops a
// future breaking major from loading against code that never saw it. Both halves matter:
// a floor alone lets MenuKit 6.0.0 rename an API out from under a shipped jar, and the
// player gets a NoSuchMethodError hours into a session instead of a refusal at launch.
// Commas are rejected outright: Fabric parses ">=5.0.0,<6.0.0" without complaint and the
// resulting predicate then matches NO version at all, which silently disables the mod.
tasks.register('verifyMenuKitRange') {
    def src = file('src/main/resources/fabric.mod.json')
    def mkVersion = (project.findProperty('menukit_version') ?: '').toString()
    inputs.file src
    inputs.property 'menukit_version', mkVersion
    doLast {
        // Floor at major.minor, not just major: a minor can add API (MenuKit 5.1.0 added
        // SlotOperations/SlotGroups) that a consumer built against it calls. Flooring at the
        // major alone would let that jar load on the unrelated 5.0.0 and die with
        // NoSuchMethodError, which is exactly the failure this check exists to prevent.
        def parts = mkVersion.replaceAll(/\+.*$/, '').tokenize('.')
        def major = Integer.parseInt(parts[0])
        def minor = Integer.parseInt(parts[1])
        def expected = ">=${major}.${minor}.0 <${major + 1}.0.0".toString()
        def depends = new groovy.json.JsonSlurper().parse(src).depends ?: [:]
        ['menukit', 'menukit-containers'].each { id ->
            def declared = depends[id]?.toString()
            if (declared == null) return
            if (declared.contains(',')) {
                throw new GradleException(
                    "fabric.mod.json: '${id}' is '${declared}'. Fabric accepts a comma here and the " +
                    "predicate then matches no version at all. Separate the bounds with a space.")
            }
            if (declared != expected) {
                throw new GradleException(
                    "fabric.mod.json: '${id}' is '${declared}', expected '${expected}'. This mod is " +
                    "built against MenuKit ${mkVersion}, so it floors at that major.minor and stops " +
                    "below the next major. See guidelines/ci-cd.md, 'MenuKit version pinning'.")
            }
        }
        println "verifyMenuKitRange: menukit '${expected}' (built against ${mkVersion})"
    }
}
build.dependsOn verifyMenuKitRange
